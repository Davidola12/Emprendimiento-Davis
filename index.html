   <script>
        let todosLosProductos = [];
        let categoriaActual = 'todos';
        let carrito = JSON.parse(localStorage.getItem('carrito')) || [];
        let ultimoFoco = null;
        let sugerenciasActuales = [];
        let indiceSugerenciaActiva = -1;
        let timerCarrito = null;
        let recientesVistos = JSON.parse(localStorage.getItem('recientes_vistos')) || [];
        let precioMaximoActual = null;
        let touchInicioY = 0;

        function escapeHtml(texto) {
            return String(texto ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function sanitizarUrl(url) {
            if (!url) return 'img/placeholder.jpg';
            return String(url).replace(/['"<>`]/g, '');
        }

        function normalizarTextoBusqueda(texto) {
            return String(texto || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function tokenizarBusqueda(consultaNormalizada) {
            return consultaNormalizada.split(' ').map(t => t.trim()).filter(Boolean);
        }

        function distanciaLevenshtein(a, b) {
            if (a === b) return 0;
            if (!a.length) return b.length;
            if (!b.length) return a.length;

            const matriz = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matriz[i][0] = i;
            for (let j = 0; j <= b.length; j++) matriz[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const costo = a[i - 1] === b[j - 1] ? 0 : 1;
                    matriz[i][j] = Math.min(
                        matriz[i - 1][j] + 1,
                        matriz[i][j - 1] + 1,
                        matriz[i - 1][j - 1] + costo
                    );
                }
            }
            return matriz[a.length][b.length];
        }

        function calcularScoreProducto(prod, consultaNormalizada, tokens) {
            const tituloOriginal = String(prod.titulo || '');
            const titulo = normalizarTextoBusqueda(tituloOriginal);
            const categoria = normalizarCategoria(prod.categoria);
            const corpus = `${titulo} ${categoria} ${String(prod.id || '')}`.trim();
            const palabras = corpus.split(' ').filter(Boolean);

            let score = 0;

            if (consultaNormalizada && titulo.includes(consultaNormalizada)) {
                score += 45;
                if (titulo.startsWith(consultaNormalizada)) score += 20;
            }

            for (const token of tokens) {
                if (corpus.includes(token)) score += 12;
                if (titulo.startsWith(token)) score += 10;
                if (palabras.some(p => p.startsWith(token))) score += 9;

                if (token.length >= 4) {
                    let cercano = false;
                    for (const palabra of palabras) {
                        if (Math.abs(palabra.length - token.length) > 1) continue;
                        if (distanciaLevenshtein(token, palabra) <= 1) {
                            cercano = true;
                            break;
                        }
                    }
                    if (cercano) score += 5;
                }
            }

            if (tokens.length > 1 && tokens.every(t => corpus.includes(t))) {
                score += 14;
            }

            return score;
        }

        function rankearProductosPorTexto(productos, consultaNormalizada) {
            const tokens = tokenizarBusqueda(consultaNormalizada);
            if (!tokens.length) return [];

            return productos
                .map(prod => ({ prod, score: calcularScoreProducto(prod, consultaNormalizada, tokens) }))
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score || String(a.prod.titulo || '').localeCompare(String(b.prod.titulo || ''), 'es'));
        }

        function obtenerTerminosOriginales() {
            const raw = String(document.getElementById('input-busqueda')?.value || '').trim();
            return raw.split(/\s+/).filter(Boolean);
        }

        function resaltarCoincidencias(texto, terminos) {
            let html = escapeHtml(texto || '');
            const unicos = Array.from(new Set((terminos || []).map(t => t.trim()).filter(t => t.length > 1)));
            unicos.sort((a, b) => b.length - a.length);

            for (const termino of unicos) {
                const safe = termino.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`(${safe})`, 'ig');
                html = html.replace(regex, '<mark>$1</mark>');
            }
            return html;
        }

        function actualizarCategoriaActivaUI(cat) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('activo', btn.dataset.cat === cat);
            });
        }

        function ocultarSugerencias() {
            const box = document.getElementById('sugerencias-busqueda');
            if (!box) return;
            box.classList.remove('show');
            box.innerHTML = '';
            sugerenciasActuales = [];
            indiceSugerenciaActiva = -1;
        }

        function renderSugerencias(productosRankeados) {
            const box = document.getElementById('sugerencias-busqueda');
            if (!box) return;

            sugerenciasActuales = productosRankeados.slice(0, 6).map(item => item.prod);
            indiceSugerenciaActiva = -1;

            if (!sugerenciasActuales.length) {
                box.classList.remove('show');
                box.innerHTML = '';
                return;
            }

            const terminos = obtenerTerminosOriginales();
            box.innerHTML = sugerenciasActuales.map((p, i) => `
                <button type="button" class="sugerencia-item" onclick="seleccionarSugerencia(${i})">
                    <span class="sugerencia-titulo">${resaltarCoincidencias(p.titulo || 'Producto', terminos)}</span>
                    <span class="sugerencia-meta">${escapeHtml(normalizarCategoria(p.categoria || 'todos'))}</span>
                </button>
            `).join('');
            box.classList.add('show');
        }

        function seleccionarSugerencia(indice) {
            const prod = sugerenciasActuales[indice];
            if (!prod) return;

            const input = document.getElementById('input-busqueda');
            if (input) input.value = String(prod.titulo || '');
            buscarGeneralRelacionada();
        }

        function actualizarSugerencias() {
            const input = document.getElementById('input-busqueda');
            const consultaNormalizada = normalizarTextoBusqueda(input?.value || '');
            if (!consultaNormalizada) {
                ocultarSugerencias();
                return;
            }

            const base = todosLosProductos.filter(p => normalizarCategoria(p.categoria) !== 'pendiente');
            const ranked = rankearProductosPorTexto(base, consultaNormalizada);
            renderSugerencias(ranked);
        }

        function moverSugerenciaActiva(direccion) {
            const box = document.getElementById('sugerencias-busqueda');
            if (!box || !sugerenciasActuales.length) return;

            indiceSugerenciaActiva += direccion;
            if (indiceSugerenciaActiva < 0) indiceSugerenciaActiva = sugerenciasActuales.length - 1;
            if (indiceSugerenciaActiva >= sugerenciasActuales.length) indiceSugerenciaActiva = 0;

            box.querySelectorAll('.sugerencia-item').forEach((el, i) => {
                el.classList.toggle('active', i === indiceSugerenciaActiva);
            });
        }

        function onInputBusqueda() {
            actualizarSugerencias();
            aplicarFiltrosYOrden();
        }

        function onBusquedaKeydown(event) {
            if (event.key === 'ArrowDown') {
                event.preventDefault();
                moverSugerenciaActiva(1);
                return;
            }

            if (event.key === 'ArrowUp') {
                event.preventDefault();
                moverSugerenciaActiva(-1);
                return;
            }

            if (event.key === 'Enter') {
                event.preventDefault();
                if (indiceSugerenciaActiva >= 0) {
                    seleccionarSugerencia(indiceSugerenciaActiva);
                } else {
                    buscarGeneralRelacionada();
                }
                return;
            }

            if (event.key === 'Escape') {
                ocultarSugerencias();
            }
        }

        function buscarGeneralRelacionada() {
            categoriaActual = 'todos';
            actualizarCategoriaActivaUI('todos');
            ocultarSugerencias();
            aplicarFiltrosYOrden();
        }

        async function cargarTienda() {
            try {
                const response = await fetch(`productos.json?t=${Date.now()}`, { cache: 'no-store' });
                const data = await response.json();
                todosLosProductos = Array.isArray(data) ? data : [];
                aplicarFiltrosYOrden();
                actualizarBadgeCarrito();
            } catch (error) {
                console.error("Error al cargar los productos.", error);
                todosLosProductos = [];
                renderizarProductos([]);
            }
        }

        function escucharCambiosInventario() {
            window.addEventListener('storage', (event) => {
                if (event.key === 'inventario_actualizado') {
                    cargarTienda();
                }
            });

            window.addEventListener('inventarioActualizado', () => {
                cargarTienda();
            });
        }

        function filtrarCategoria(cat, elementoBtn) {
    categoriaActual = cat;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('activo'));
    elementoBtn.classList.add('activo');
    aplicarFiltrosYOrden();
}

function normalizarCategoria(valor) {
    const mapa = {
        'accesorios': 'accesorios',
        'carros': 'accesorios',
        'motos': 'accesorios',
        'luces': 'luces',
        'luces-auto-moto': 'luces',
        'luces para auto y moto': 'luces',
        'neblinera': 'neblineras',
        'neblineras': 'neblineras',
        'neblinero': 'neblineras',
        'neblineros': 'neblineras',
        'neblineras para carro y moto': 'neblineras',
        'neblineros para carro y moto': 'neblineras',
        'tecnologia': 'tecnologia',
        'ferreteria': 'ferreteria',
        'hogar': 'hogar',
        'oficina': 'oficina',
        'oficina-escolar': 'oficina',
        'escolar': 'oficina',
        'ofertas': 'ofertas',
        'servicios': 'servicios',
        'pendiente': 'pendiente',
        'todos': 'todos'
    };

    return mapa[String(valor || '').toLowerCase()] || 'todos';
}

function aplicarFiltrosYOrden() {
    const textoBusqueda = document.getElementById('input-busqueda').value;
    const textoBusquedaNormalizado = normalizarTextoBusqueda(textoBusqueda);
    const tipoOrden = document.getElementById('select-orden').value;
    const categoriaSeleccionada = normalizarCategoria(categoriaActual);

    if (categoriaSeleccionada === 'servicios') {
        renderizarProductos([]);
        return;
    }

    let resultados = todosLosProductos.filter(prod => {
        const categoriaProd = normalizarCategoria(prod.categoria);

        if (categoriaSeleccionada === 'todos') return categoriaProd !== 'pendiente';
        if (categoriaSeleccionada === 'ofertas') return Number(prod.precio_venta || 0) < 15;
        return categoriaProd === categoriaSeleccionada;
    });

    if (precioMaximoActual !== null) {
        resultados = resultados.filter(prod => Number(prod.precio_venta || 0) <= precioMaximoActual);
    }

    if (textoBusquedaNormalizado) {
        const rankeados = rankearProductosPorTexto(resultados, textoBusquedaNormalizado);
        resultados = rankeados.map(item => item.prod);

        if (tipoOrden === 'precio-bajo') {
            resultados.sort((a, b) => Number(a.precio_venta || 0) - Number(b.precio_venta || 0));
        } else if (tipoOrden === 'precio-alto') {
            resultados.sort((a, b) => Number(b.precio_venta || 0) - Number(a.precio_venta || 0));
        }
    } else {
        if (tipoOrden === 'precio-bajo') {
            resultados.sort((a, b) => Number(a.precio_venta || 0) - Number(b.precio_venta || 0));
        } else if (tipoOrden === 'precio-alto') {
            resultados.sort((a, b) => Number(b.precio_venta || 0) - Number(a.precio_venta || 0));
        }
    }

    renderizarProductos(resultados);
}

function aplicarFiltroPrecio(valor) {
    const max = Number(valor);
    const label = document.getElementById('precio-max-label');
    const resetBtn = document.getElementById('btn-limpiar-precio');
    if (max >= 200) {
        precioMaximoActual = null;
        if (label) label.textContent = 'Sin límite';
    } else {
        precioMaximoActual = max;
        if (label) label.textContent = 'Q' + max.toFixed(2);
    }
    if (resetBtn) resetBtn.style.display = precioMaximoActual === null ? 'none' : 'inline-block';
    aplicarFiltrosYOrden();
}

function limpiarFiltroPrecio() {
    const range = document.getElementById('range-precio');
    if (range) range.value = 200;
    aplicarFiltroPrecio(200);
}

function renderizarProductos(productosParaMostrar) {
    const grid = document.getElementById('grid-productos');
    grid.innerHTML = '';

    if (categoriaActual === 'servicios') {
        grid.innerHTML = `
            <div class="servicios-grid-inline">
                <div class="servicio-card">
                    <div class="servicio-icon">🌐</div>
                    <h3>Páginas Web y Responsive</h3>
                    <p>Creación de sitios web modernos, rápidos y adaptables a cualquier dispositivo móvil usando HTML5 y CSS.</p>
                </div>
                <div class="servicio-card">
                    <div class="servicio-icon">💻</div>
                    <h3>Aplicaciones de Escritorio</h3>
                    <p>Desarrollo de herramientas ligeras en Python y Java para automatización, inventarios y bases de datos SQL/Oracle.</p>
                </div>
                <div class="servicio-card">
                    <div class="servicio-icon">⚙️</div>
                    <h3>Automatización y Broadcast</h3>
                    <p>Integraciones con WebSockets, plugins gráficos y rutinas para OBS y vMix en producción de video.</p>
                </div>
            </div>
            <div class="servicios-cta-inline">
                <a href="https://wa.me/50239710831?text=Hola,%20estoy%20interesado%20en%20contratar%20tus%20servicios%20de%20desarrollo." target="_blank" class="btn-cotizar">
                    💬 Cotizar Proyecto por WhatsApp
                </a>
            </div>
        `;
        return;
    }

    if (productosParaMostrar.length === 0) {
        grid.innerHTML = '<p class="no-productos">No se encontraron productos disponibles en esta sección.</p>';
        return;
    }

    productosParaMostrar.forEach(prod => {
        let card = document.createElement('div');
        const stock = Number(prod.stock ?? 0);
        const destacado = !!prod.destacado;
        const agotado = stock <= 0;
        const tituloBase = String(prod.titulo || 'Producto');
        const tituloEscapado = escapeHtml(tituloBase);
        const titulo = resaltarCoincidencias(tituloBase, obtenerTerminosOriginales());
        const precio = Number(prod.precio_venta || 0);
        const imgSrc = sanitizarUrl(prod.imagen || 'img/placeholder.jpg');
        const esOferta = precio < 15;

        card.className = `product-card ${agotado ? 'product-card-agotado' : ''} ${destacado ? 'product-card-destacado' : ''}`;

        card.innerHTML = `
            <div class="card-img-container">
                <img src="${imgSrc}" alt="${tituloEscapado}" class="card-img-trigger" role="button" tabindex="0" aria-label="Ver detalle de ${tituloEscapado}" onclick="abrirProductoModal(${prod.id})" onkeydown="onProductoImagenKeydown(event, ${prod.id})">
                ${destacado ? '<span class="badge-destacado">Destacado</span>' : ''}
                ${esOferta ? '<span class="badge-oferta">🔥 OFERTA</span>' : ''}
                ${agotado ? '<span class="badge-agotado">Agotado</span>' : ''}
            </div>
            <div class="card-body">
                <h3 class="card-title">${titulo}</h3>
                <div class="card-price">Q${precio.toFixed(2)}</div>
                <button class="btn-buy" onclick="agregarAlCarrito(${prod.id})" ${agotado ? 'disabled' : ''}>
                    ${agotado ? 'Sin stock' : '🛒 Agregar al Carrito'}
                </button>
            </div>
        `;
        grid.appendChild(card);
    });

    if (categoriaActual === 'todos') {
        actualizarRecientesVistosUI();
    }

    const volverInicio = document.createElement('div');
    volverInicio.className = 'btn-volver-inicio';
    volverInicio.innerHTML = '<button onclick="window.scrollTo({ top: 0, behavior: \'smooth\' })">⬆ Volver al Inicio</button>';
    grid.appendChild(volverInicio);
}

function onProductoImagenKeydown(event, idProducto) {
    if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        abrirProductoModal(idProducto);
    }
}

function agregarAlCarrito(idProducto) {
    const producto = todosLosProductos.find(p => p.id === idProducto);
    if (!producto) return;

    const stock = Number(producto.stock ?? 0);
    if (stock <= 0) return;

    const itemExistente = carrito.find(p => p.id === idProducto);
    if (itemExistente) {
        itemExistente.cantidad++;
    } else {
        carrito.push({ ...producto, cantidad: 1 });
    }

    guardarCarrito();
    actualizarBadgeCarrito();
    mostrarCarritoTemporal();
}

function mostrarCarritoTemporal() {
    const btn = document.querySelector('.cart-float-btn');
    const badge = document.getElementById('cart-count');
    if (!btn) return;

    if (timerCarrito) {
        clearTimeout(timerCarrito);
        timerCarrito = null;
    }

    btn.classList.add('visible');

    if (badge) {
        badge.classList.remove('pulse');
        void badge.offsetWidth;
        badge.classList.add('pulse');
    }

    timerCarrito = setTimeout(() => {
        ocultarCarritoBtn();
    }, 4000);
}

function ocultarCarritoBtn() {
    const btn = document.querySelector('.cart-float-btn');
    if (!btn) return;
    if (carrito.length > 0 && document.getElementById('modal-carrito')?.classList.contains('activo')) return;
    btn.classList.remove('visible');
}

function configurarBotonCarritoDinamico() {
    const btn = document.querySelector('.cart-float-btn');
    if (!btn) return;

    btn.addEventListener('mouseenter', () => {
        if (timerCarrito) {
            clearTimeout(timerCarrito);
            timerCarrito = null;
        }
    });

    btn.addEventListener('mouseleave', () => {
        if (carrito.length > 0 && !document.getElementById('modal-carrito')?.classList.contains('activo')) {
            timerCarrito = setTimeout(() => {
                ocultarCarritoBtn();
            }, 4000);
        }
    });
}

function guardarCarrito() {
    localStorage.setItem('carrito', JSON.stringify(carrito));
}

function renderizarCarrito() {
    const contenedor = document.getElementById('lista-carrito');
    const formCheckout = document.getElementById('checkout-form');

    if (!contenedor) return;

    contenedor.innerHTML = '';

    if (carrito.length === 0) {
        contenedor.innerHTML = '<p style="text-align:center; color:#64748b; padding:20px 0; margin:0;">Tu carrito está vacío.</p>';
        if (formCheckout) formCheckout.style.display = 'none';
        actualizarTotales();
        return;
    }

    if (formCheckout) formCheckout.style.display = 'block';

    carrito.forEach(prod => {
        const itemDiv = document.createElement('div');
        itemDiv.className = 'cart-item';
        const titulo = escapeHtml(prod.titulo || 'Producto');
        const imagen = sanitizarUrl(prod.imagen || 'img/placeholder.jpg');
        itemDiv.innerHTML = `
            <img src="${imagen}" class="cart-item-img" alt="${titulo}">
            <div class="cart-item-info">
                <div class="cart-item-title">${titulo}</div>
                <div class="cart-item-price">Q${Number(prod.precio_venta || 0).toFixed(2)}</div>
            </div>
            <div class="cart-actions-box">
                <div class="cart-qty-controls">
                    <button class="btn-qty" onclick="cambiarCantidad(${prod.id}, -1)">-</button>
                    <span>${prod.cantidad}</span>
                    <button class="btn-qty" onclick="cambiarCantidad(${prod.id}, 1)">+</button>
                </div>
                <button class="btn-remove-item" onclick="quitarDelCarrito(${prod.id})">Quitar</button>
            </div>
        `;
        contenedor.appendChild(itemDiv);
    });

    actualizarTotales();
}

function actualizarBadgeCarrito() {
    const totalItems = carrito.reduce((sum, p) => sum + p.cantidad, 0);
    const badge = document.getElementById('cart-count');
    if (badge) badge.innerText = totalItems;
}

function abrirCarrito() {
    if (timerCarrito) {
        clearTimeout(timerCarrito);
        timerCarrito = null;
    }
    ultimoFoco = document.activeElement;
    document.getElementById('modal-carrito').classList.add('activo');
    renderizarCarrito();
    const cerrarBtn = document.querySelector('#modal-carrito .btn-close-modal');
    if (cerrarBtn) cerrarBtn.focus();
}

function cerrarCarrito() {
    document.getElementById('modal-carrito').classList.remove('activo');
    document.getElementById('cart-modal-box').classList.remove('minimizado');
    const btnToggle = document.getElementById('btn-toggle-cart');
    if (btnToggle) btnToggle.textContent = '—';
    restaurarFoco();
    if (carrito.length > 0) {
        timerCarrito = setTimeout(() => { ocultarCarritoBtn(); }, 4000);
    } else {
        ocultarCarritoBtn();
    }
}

function abrirProductoModal(idProducto) {
    const producto = todosLosProductos.find(p => p.id === idProducto);
    if (!producto) return;

    const contenedor = document.getElementById('producto-detalle');
    const modal = document.getElementById('modal-producto');
    const stock = Number(producto.stock ?? 0);
    const titulo = escapeHtml(producto.titulo || 'Producto');
    const categoria = escapeHtml(normalizarCategoria(producto.categoria || 'todos'));
    const precio = Number(producto.precio_venta || 0);
    const imagen = sanitizarUrl(producto.imagen || 'img/placeholder.jpg');
    const esOferta = precio < 15;

    contenedor.innerHTML = `
        <div class="product-modal-image-wrap">
            <img src="${imagen}" alt="${titulo}" class="product-modal-image" onclick="abrirLightbox('${imagen}', '${titulo}')" role="button" tabindex="0" aria-label="Ampliar imagen">
        </div>
        <div class="product-modal-info">
            <span class="product-modal-category">${categoria}</span>
            ${esOferta ? '<span class="badge-oferta-modal">🔥 OFERTA</span>' : ''}
            <h3>${titulo}</h3>
            <div class="product-modal-price">Q${precio.toFixed(2)}</div>
            <p class="product-modal-status">${stock > 0 ? 'Disponible ahora' : 'Agotado'}</p>
            <p class="product-modal-description">${stock > 0 ? 'Producto disponible para entrega o retiro. Puedes agregarlo al carrito para coordinar tu pedido por WhatsApp.' : 'Este producto actualmente no tiene stock disponible.'}</p>
            <button class="btn-buy product-modal-btn" onclick="agregarAlCarrito(${producto.id}); cerrarProductoModal();" ${stock > 0 ? '' : 'disabled'}>
                ${stock > 0 ? '🛒 Agregar al carrito' : 'Sin stock'}
            </button>
        </div>
    `;

    registrarRecienteVisto(producto);

    if (modal) {
        ultimoFoco = document.activeElement;
        modal.classList.add('activo');
        const cerrarBtn = document.querySelector('#modal-producto .product-close');
        if (cerrarBtn) cerrarBtn.focus();
    }
}

function abrirLightbox(src, caption) {
    const lb = document.getElementById('lightbox');
    const img = document.getElementById('lightbox-img');
    const cap = document.getElementById('lightbox-caption');
    if (!lb || !img) return;
    img.src = src;
    img.alt = caption || '';
    cap.textContent = caption || '';
    lb.classList.add('activo');
    const closeBtn = document.querySelector('.lightbox-close');
    if (closeBtn) closeBtn.focus();
}

function cerrarLightbox() {
    const lb = document.getElementById('lightbox');
    if (lb) lb.classList.remove('activo');
    const modal = document.getElementById('modal-producto');
    if (modal && modal.classList.contains('activo')) {
        const cerrarBtn = modal.querySelector('.product-close');
        if (cerrarBtn) cerrarBtn.focus();
    } else {
        restaurarFoco();
    }
}

function registrarRecienteVisto(producto) {
    if (!producto) return;
    recientesVistos = recientesVistos.filter(p => p.id !== producto.id);
    recientesVistos.unshift({ id: producto.id, titulo: producto.titulo, imagen: producto.imagen, precio_venta: producto.precio_venta, categoria: producto.categoria });
    recientesVistos = recientesVistos.slice(0, 8);
    localStorage.setItem('recientes_vistos', JSON.stringify(recientesVistos));
    actualizarRecientesVistosUI();
}

function actualizarRecientesVistosUI() {
    if (categoriaActual !== 'todos') return;
    const grid = document.getElementById('grid-productos');
    const bloque = document.getElementById('recientes-vistos-bloque');
    if (!recientesVistos.length) return;
    let bloqueHTML = `
        <div class="recientes-bloque">
            <h3 class="recientes-titulo">🕘 Recientemente vistos</h3>
            <div class="recientes-grid">
    `;
    recientesVistos.forEach(p => {
        const img = sanitizarUrl(p.imagen || 'img/placeholder.jpg');
        bloqueHTML += `
            <div class="reciente-item" onclick="abrirProductoModal(${p.id})" role="button" tabindex="0">
                <img src="${img}" alt="${escapeHtml(p.titulo || '')}">
                <span class="reciente-precio">Q${Number(p.precio_venta || 0).toFixed(2)}</span>
            </div>
        `;
    });
    bloqueHTML += `</div></div>`;
    if (grid) grid.appendChild(bloqueHTML);
}

function cerrarProductoModal() {
    const modal = document.getElementById('modal-producto');
    if (modal) modal.classList.remove('activo');
    restaurarFoco();
}

function restaurarFoco() {
    if (ultimoFoco && typeof ultimoFoco.focus === 'function') {
        ultimoFoco.focus();
    }
}

function configurarAccesibilidadTeclado() {
    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            const modalProducto = document.getElementById('modal-producto');
            const modalCarrito = document.getElementById('modal-carrito');
            const lightbox = document.getElementById('lightbox');

            if (lightbox && lightbox.classList.contains('activo')) {
                cerrarLightbox();
                return;
            }

            if (modalProducto && modalProducto.classList.contains('activo')) {
                cerrarProductoModal();
                return;
            }

            if (modalCarrito && modalCarrito.classList.contains('activo')) {
                cerrarCarrito();
            }
        }
    });

    const modalProducto = document.getElementById('modal-producto');
    const modalCarrito = document.getElementById('modal-carrito');
    const lightbox = document.getElementById('lightbox');

    if (modalProducto) {
        modalProducto.addEventListener('click', (event) => {
            if (event.target === modalProducto) {
                cerrarProductoModal();
            }
        });
    }

    if (modalCarrito) {
        modalCarrito.addEventListener('click', (event) => {
            if (event.target === modalCarrito) {
                cerrarCarrito();
            }
        });
    }

    if (lightbox) {
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) {
                cerrarLightbox();
            }
        });
    }

    configurarSwipeCierre();
}

function configurarSwipeCierre() {
    const overlays = document.querySelectorAll('.modal-overlay');
    overlays.forEach(overlay => {
        overlay.addEventListener('touchstart', (event) => {
            touchInicioY = event.touches[0].clientY;
        }, { passive: true });

        overlay.addEventListener('touchmove', (event) => {
            if (touchInicioY === 0) return;
            const diff = event.touches[0].clientY - touchInicioY;
            if (diff > 50) {
                if (overlay.id === 'modal-producto') cerrarProductoModal();
                if (overlay.id === 'modal-carrito') cerrarCarrito();
                touchInicioY = 0;
            }
        }, { passive: true });
    });
}

function toggleCarritoTamano() {
    const modal = document.getElementById('cart-modal-box');
    const btnToggle = document.getElementById('btn-toggle-cart');
    if (!modal || !btnToggle) return;

    modal.classList.toggle('minimizado');
    btnToggle.textContent = modal.classList.contains('minimizado') ? '□' : '—';
}

function cambiarCantidad(idProducto, cambio) {
    const item = carrito.find(p => p.id === idProducto);
    if (!item) return;

    item.cantidad += cambio;
    if (item.cantidad <= 0) {
        carrito = carrito.filter(p => p.id !== idProducto);
    }
    
    guardarCarrito();
    actualizarBadgeCarrito();
    renderizarCarrito();
    if (carrito.length === 0) ocultarCarritoBtn();
}

function quitarDelCarrito(idProducto) {
    carrito = carrito.filter(p => p.id !== idProducto);
    guardarCarrito();
    actualizarBadgeCarrito();
    renderizarCarrito();
    if (carrito.length === 0) ocultarCarritoBtn();
}

function actualizarTotales() {
    const subtotal = carrito.reduce((sum, p) => sum + (p.precio_venta * p.cantidad), 0);
    const total = subtotal;

    document.getElementById('cart-subtotal').innerText = `Q${subtotal.toFixed(2)}`;
    document.getElementById('cart-shipping').innerText = 'Por coordinar';
    document.getElementById('cart-total').innerText = `Q${total.toFixed(2)}`;
}

function confirmarPedidoWhatsApp() {
    if (carrito.length === 0) {
        alert("Tu carrito está vacío.");
        return;
    }

    const direccion = document.getElementById('direccion-cliente');
    if (!direccion || !direccion.value.trim()) {
        alert('Por favor escribe tu dirección o ubicación para coordinar la entrega.');
        direccion?.focus();
        return;
    }

    enviarPedidoWhatsApp();
}

function enviarPedidoWhatsApp() {
    if (carrito.length === 0) {
        alert("Tu carrito está vacío.");
        return;
    }

    const metodoPago = document.getElementById('select-pago').value;
    const selectEnvio = document.getElementById('select-envio');
    const direccionCliente = document.getElementById('direccion-cliente');
    const direccionTexto = direccionCliente ? direccionCliente.value.trim() : 'No especificada';
    const tipoEnvioTexto = selectEnvio ? selectEnvio.options[selectEnvio.selectedIndex].text : 'Por coordinar';

    const subtotal = carrito.reduce((sum, p) => sum + (p.precio_venta * p.cantidad), 0);
    const total = subtotal;

    let mensaje = `Hola, quiero realizar el siguiente pedido:\n\n`;
    carrito.forEach(p => {
        mensaje += `• ${p.cantidad}x ${p.titulo} - Q${(p.precio_venta * p.cantidad).toFixed(2)}\n`;
    });

    mensaje += `\n------------------\n`;
    mensaje += `Subtotal: Q${subtotal.toFixed(2)}\n`;
    mensaje += `Envío: ${tipoEnvioTexto}\n`;
    mensaje += `Dirección / ubicación: ${direccionTexto}\n`;
    mensaje += `Total a pagar: Q${total.toFixed(2)}\n`;
    mensaje += `Método de pago: ${metodoPago}\n`;

    const numeroTelefono = "50239710831"; 
    const urlWhatsApp = `https://wa.me/${numeroTelefono}?text=${encodeURIComponent(mensaje)}`;

    window.open(urlWhatsApp, '_blank');

    carrito = [];
    guardarCarrito();
    actualizarBadgeCarrito();
    renderizarCarrito();
    if (direccionCliente) direccionCliente.value = '';
    cerrarCarrito();
}

// Inicializar la tienda al cargar la página
window.addEventListener('DOMContentLoaded', () => {
    cargarTienda();
    escucharCambiosInventario();
    configurarAccesibilidadTeclado();
    configurarBotonCarritoDinamico();

    const inputBusqueda = document.getElementById('input-busqueda');
    if (inputBusqueda) {
        inputBusqueda.addEventListener('focus', () => {
            if (inputBusqueda.value.trim()) {
                actualizarSugerencias();
            }
        });
    }

    document.addEventListener('click', (event) => {
        const contenedor = document.querySelector('.busqueda-wrap');
        if (!contenedor) return;
        if (!contenedor.contains(event.target)) {
            ocultarSugerencias();
        }
    });
});
    </script>
